[env:upesy_wroom]
platform = espressif32
board = upesy_wroom
framework = arduino
lib_deps = 
	adafruit/Adafruit GFX Library@^1.12.4
	dlloydev/ESP32 ESP32S2 AnalogWrite@^5.0.2
	madhephaestus/ESP32Servo@^3.0.9
	adafruit/Adafruit NeoPixel@^1.15.2
	adafruit/Adafruit ILI9341@^1.6.2
